name: Test Gemini provider

on:
  push:
    branches:
      - "feature/gemini-provider"
  pull_request:
    branches:
      - main

jobs:
  gemini-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:gemini
