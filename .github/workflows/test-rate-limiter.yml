name: Test HK.AI preview rate limiter
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview origin and harmless API validation
        shell: bash
        run: |
          set -euo pipefail
          URL="https://fix-production-durable-objec.hk-ai.pages.dev/api/chat"
          ORIGIN="https://fix-production-durable-objec.hk-ai.pages.dev"
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            --output response.json \
            --write-out "%{http_code}" \
            --request POST "$URL" \
            --header "Origin: $ORIGIN" \
            --header "Content-Type: application/json" \
            --data '{}')
          echo "initial_http_status=$HTTP_CODE"
          cat response.json
          echo
          if [ "$HTTP_CODE" != "400" ] || ! grep -q "Invalid messages" response.json; then
            echo "FAIL: expected harmless 400 validation response after origin and rate-limiter checks."
            exit 1
          fi
          echo "PASS: initial request passed origin and rate-limiter checks."

      - name: Verify the 30-request per-minute limit on preview only
        shell: bash
        run: |
          set -euo pipefail
          URL="https://fix-production-durable-objec.hk-ai.pages.dev/api/chat"
          ORIGIN="https://fix-production-durable-objec.hk-ai.pages.dev"
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl --silent --show-error --max-time 30 \
              --output "response-$i.json" \
              --write-out "%{http_code}" \
              --request POST "$URL" \
              --header "Origin: $ORIGIN" \
              --header "Content-Type: application/json" \
              --data '{}')
            echo "request=$((i + 1)) http_status=$HTTP_CODE"
            if [ "$i" -lt 30 ]; then
              if [ "$HTTP_CODE" != "400" ]; then
                echo "FAIL: request $((i + 1)) should still be under the 30-request limit."
                cat "response-$i.json"
                exit 1
              fi
            else
              if [ "$HTTP_CODE" != "429" ]; then
                echo "FAIL: request 31 should be rate limited with HTTP 429."
                cat "response-$i.json"
                exit 1
              fi
              if ! grep -qi "too many requests" "response-$i.json"; then
                echo "FAIL: HTTP 429 response did not contain the expected rate-limit message."
                cat "response-$i.json"
                exit 1
              fi
            fi
          done
          echo "PASS: first 30 requests were allowed through middleware; request 31 was rate limited."
