name: Test HK.AI rate limiter

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-limiter-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Durable Object rate limiter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Durable Object and middleware tests
        run: npm run test:rate-limiter

      - name: Validate Worker configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run --config rate-limiter/wrangler.jsonc
