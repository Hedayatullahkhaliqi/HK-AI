
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK AI</title>
<style>
body {
  margin: 0;
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #111c2e;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #26364e;
}
.logo {
  color: #4b91ff;
  font-size: 35px;
  font-weight: bold;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}
#welcome {
  text-align: center;
  margin-top: 90px;
}
#chat {
  min-height: 300px;
}
.message {
  padding: 13px;
  margin: 12px 0;
  border-radius: 12px;
  background: #172943;
  white-space: pre-wrap;
}
.user {
  background: #24569a;
  text-align: right;
}
.composer {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
textarea {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  background: #172943;
  color: white;
  border: 1px solid #40516b;
}
button {
  background: #3985e8;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 10px;
}
</style>
</head>
<body>

<header>
  <div class="logo">HK</div>
  <div>YOUR AI ASSISTANT</div>
</header>

<main>
  <div id="welcome">
    <h2>Hello, I'm HK.</h2>
    <p>Your multilingual AI assistant.</p>
    <p>Welcome to HK AI!</p>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <textarea id="input"
      placeholder="Message HK..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>
</main>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();
  if (!text) return;

  welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message user";
  message.textContent = text;

  chat.appendChild(message);

  const reply = document.createElement("div");
  reply.className = "message";
  reply.textContent =
    "Welcome! HK AI is being developed. Its AI engine will be connected soon.";

  chat.appendChild(reply);
  input.value = "";
}
</script>

</body>
</html>
