
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<title>HK AI - Smart Assistant</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #080d19;
  --panel: #101827;
  --panel2: #172235;
  --border: rgba(255,255,255,.09);
  --text: #edf3ff;
  --muted: #91a0b8;
  --blue: #438cff;
  --blue2: #2563eb;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
}

body {
  min-height: 100dvh;
}

button, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  max-width: 1100px;
  margin: auto;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  height: 70px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(8,13,25,.95);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  background: linear-gradient(145deg,#254b83,#10223d);
  border: 1px solid rgba(112,174,255,.4);
  display: grid;
  place-items: center;
  font-size: 19px;
  font-weight: 900;
  color: #dceaff;
  box-shadow: 0 0 22px rgba(55,130,255,.17);
}

.brand-name {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .4px;
}

.brand-sub {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}

.new-chat {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 10px 13px;
  font-size: 12px;
}

.new-chat:active {
  transform: scale(.97);
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 20px 16px 12px;
}

.welcome {
  margin: auto;
  width: 100%;
  max-width: 620px;
  text-align: center;
  padding: 30px 5px;
}

.welcome-logo {
  width: 76px;
  height: 76px;
  margin: 0 auto 20px;
  border-radius: 25px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg,#244e88,#101e36);
  border: 1px solid rgba(112,174,255,.4);
  color: #e5f0ff;
  font-size: 30px;
  font-weight: 900;
  box-shadow: 0 0 45px rgba(48,125,255,.18);
}

.welcome h1 {
  font-size: 27px;
  margin: 0 0 10px;
}

.welcome p {
  color: var(--muted);
  line-height: 1.9;
  font-size: 14px;
  margin: 0 auto 24px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
  text-align: right;
}

.suggestion {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
  color: var(--text);
  padding: 14px 12px;
  font-size: 12px;
  line-height: 1.7;
  text-align: right;
}

.suggestion:active {
  background: var(--panel2);
}

#chat {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 12px 0 25px;
}

.message {
  display: flex;
  flex-direction: column;
  max-width: 90%;
  gap: 7px;
}

.message.user {
  align-self: flex-start;
}

.message.assistant {
  align-self: flex-end;
}

.message-label {
  color: var(--muted);
  font-size: 11px;
  padding: 0 5px;
}

.message-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.9;
  font-size: 14px;
  padding: 12px 15px;
  border-radius: 16px;
}

.user .message-content {
  background: #18345a;
  border: 1px solid rgba(85,150,255,.2);
  border-bottom-left-radius: 5px;
}

.assistant .message-content {
  background: var(--panel);
  border: 1px solid var(--border);
  border-bottom-right-radius: 5px;
}

.message-actions {
  display: flex;
  justify-content: flex-end;
}

.copy-btn {
  color: var(--muted);
  background: transparent;
  border: 0;
  font-size: 11px;
  padding: 5px;
}

.typing {
  color: var(--muted);
  font-size: 13px;
  padding: 10px;
}

.composer-area {
  position: sticky;
  bottom: 0;
  padding: 10px 14px 12px;
  background: linear-gradient(transparent,var(--bg) 18%);
  z-index: 5;
}

.composer {
  max-width: 760px;
  margin: auto;
}

.file-preview {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 12px;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--muted);
}

.file-preview.show {
  display: flex;
}

.remove-file {
  color: #ff8585;
  border: 0;
  background: transparent;
  font-size: 18px;
}

.input-box {
  direction: rtl;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 9px;
  background: #111c2d;
  border: 1px solid rgba(125,160,210,.2);
  border-radius: 18px;
  box-shadow: 0 8px 35px rgba(0,0,0,.2);
}

.input-box:focus-within {
  border-color: rgba(67,140,255,.65);
}

#messageInput {
  flex: 1;
  min-width: 0;
  min-height: 42px;
  max-height: 150px;
  resize: none;
  outline: none;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 10px 4px;
  font-size: 14px;
  line-height: 1.6;
  direction: auto;
}

#messageInput::placeholder {
  color: #78869e;
}

.attach-btn, .send-btn {
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  border-radius: 13px;
  border: 0;
  display: grid;
  place-items: center;
  font-size: 19px;
}

.send-btn {
  background: var(--blue);
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.send-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.attach-btn {
  background: var(--panel2);
  color: #b9c9e2;
}

#fileInput {
  display: none;
}

.footer-note {
  text-align: center;
  color: #64728a;
  font-size: 10px;
  padding-top: 9px;
}

@media (max-width: 480px) {
  header {
    height: 62px;
    padding: 0 12px;
  }

  main {
    padding: 12px 12px;
  }

  .welcome h1 {
    font-size: 23px;
  }

  .message {
    max-width: 95%;
  }

  .composer-area {
    padding-left: 9px;
    padding-right: 9px;
  }
}

@media (max-width: 350px) {
  .suggestions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">HK</div>
    <div>
      <div class="brand-name">HK AI</div>
      <div class="brand-sub">Hedayatullah Khaliqi</div>
    </div>
  </div>

  <button class="new-chat" id="newChatBtn">＋ گفتگوی جدید</button>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="welcome-logo">HK</div>
    <h1>به HK AI خوش آمدید</h1>
    <p>
      دستیار هوشمند شما برای یادگیری، نوشتن، ترجمه،
      برنامه‌نویسی، تحلیل و پاسخ به پرسش‌ها.
    </p>

    <div class="suggestions">
      <button class="suggestion" data-prompt="هوش مصنوعی چیست؟ به زبان ساده توضیح بده.">
        ✨ هوش مصنوعی چیست؟
      </button>

      <button class="suggestion" data-prompt="یک برنامه برای یادگیری زبان انگلیسی برایم بساز.">
        📚 یادگیری زبان انگلیسی
      </button>

      <button class="suggestion" data-prompt="یک کد ساده HTML برای ساخت وب‌سایت بنویس.">
        💻 کمک در برنامه‌نویسی
      </button>

      <button class="suggestion" data-prompt="امکانات و کاربردهای مهم هوش مصنوعی را توضیح بده.">
        🧠 پرسش عمومی
      </button>
    </div>
  </section>

  <section id="chat"></section>
</main>

<div class="composer-area">
  <div class="composer">

    <div class="file-preview" id="filePreview">
      <span id="fileName">فایل انتخاب شد</span>
      <button class="remove-file" id="removeFile" title="حذف فایل">×</button>
    </div>

    <div class="input-box">

      <button class="send-btn" id="sendBtn" title="ارسال پیام">➤</button>

      <textarea
        id="messageInput"
        rows="1"
        placeholder="پیام خود را بنویسید..."
      ></textarea>

      <button class="attach-btn" id="attachBtn" title="افزودن PDF">＋</button>

      <input
        type="file"
        id="fileInput"
        accept=".pdf,application/pdf"
      >

    </div>

    <div class="footer-note">
      HK AI ممکن است گاهی اشتباه کند؛ پاسخ‌های مهم را بررسی کنید.
    </div>

  </div>
</div>

</div>

<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const filePreview = document.getElementById("filePreview");
const fileName = document.getElementById("fileName");
const removeFileBtn = document.getElementById("removeFile");

let messages = [];
let busy = false;
let selectedDocument = "";
let selectedFile = null;

function addMessage(role, content) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = role === "user" ? "شما" : "HK AI";

  const text = document.createElement("div");
  text.className = "message-content";
  text.textContent = content;

  wrapper.appendChild(label);
  wrapper.appendChild(text);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "کاپی پاسخ";

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(content);
        copy.textContent = "کاپی شد ✓";
      } catch {
        copy.textContent = "کاپی نشد";
      }
    });

    actions.appendChild(copy);
    wrapper.appendChild(actions);
  }

  chat.appendChild(wrapper);
  wrapper.scrollIntoView({ behavior: "smooth", block: "end" });
}

function showTyping() {
  const element = document.createElement("div");
  element.className = "typing";
  element.id = "typing";
  element.textContent = "HK AI در حال نوشتن پاسخ است...";
  chat.appendChild(element);
}

function removeTyping() {
  const element = document.getElementById("typing");
  if (element) element.remove();
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  input.disabled = value;
  attachBtn.disabled = value;
  sendBtn.textContent = value ? "…" : "➤";
}

function clearSelectedFile() {
  selectedDocument = "";
  selectedFile = null;
  fileInput.value = "";
  filePreview.classList.remove("show");
  fileName.textContent = "";
}

async function extractPDF(file) {
  if (!window.pdfjsLib) {
    throw new Error("ابزار خواندن PDF بارگذاری نشد. اینترنت را بررسی کنید.");
  }

  if (file.size > 10 * 1024 * 1024) {
    throw new Error("حجم فایل PDF نباید بیشتر از ۱۰ مگابایت باشد.");
  }

  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({
    data: new Uint8Array(buffer)
  }).promise;

  if (pdf.numPages > 30) {
    throw new Error("فایل PDF نباید بیشتر از ۳۰ صفحه باشد.");
  }

  let fullText = "";

  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    const page = await pdf.getPage(pageNumber);
    const content = await page.getTextContent();

    const pageText = content.items
      .map(item => item.str)
      .join(" ");

    fullText += pageText + "\n";

    if (fullText.length > 30000) {
      fullText = fullText.slice(0, 30000);
      break;
    }
  }

  if (!fullText.trim()) {
    throw new Error("متنی در این PDF پیدا نشد. شاید فایل اسکن‌شده باشد.");
  }

  return fullText;
}

async function sendMessage(customText = null) {
  if (busy) return;

  const text = (customText || input.value).trim();

  if (!text && !selectedFile) return;

  let userMessage = text;

  if (selectedFile && selectedDocument) {
    userMessage = text
      ? text + "\n\nفایل PDF: " + selectedFile.name
      : "لطفاً محتوای فایل PDF پیوست‌شده را بررسی کن: " + selectedFile.name;
  }

  if (!userMessage) return;

  welcome.style.display = "none";

  addMessage("user", userMessage);

  messages.push({
    role: "user",
    content: userMessage
  });

  input.value = "";
  input.style.height = "42px";

  setBusy(true);
  showTyping();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages.slice(-20),
        document: selectedDocument
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("پاسخ سرور قابل خواندن نیست.");
    }

    if (!response.ok) {
      throw new Error(data.error || "خطا در ارتباط با سرور.");
    }

    if (!data.reply) {
      throw new Error("پاسخ خالی از سرور دریافت شد.");
    }

    messages.push({
      role: "assistant",
      content: data.reply
    });

    addMessage("assistant", data.reply);

    clearSelectedFile();

  } catch (error) {
    const errorText = error.message ||
      "ارتباط با سرور برقرار نشد. دوباره تلاش کنید.";

    addMessage("assistant", "متأسفم، مشکلی پیش آمد:\n" + errorText);

    messages.pop();

  } finally {
    removeTyping();
    setBusy(false);
    input.focus();
  }
}

sendBtn.addEventListener("click", () => {
  sendMessage();
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "42px";
  input.style.height =
    Math.min(input.scrollHeight, 150) + "px";
});

attachBtn.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];

  if (!file) return;

  if (file.type !== "application/pdf" &&
      !file.name.toLowerCase().endsWith(".pdf")) {
    alert("لطفاً فقط فایل PDF انتخاب کنید.");
    clearSelectedFile();
    return;
  }

  selectedFile = file;
  fileName.textContent = "در حال خواندن: " + file.name;
  filePreview.classList.add("show");

  try {
    selectedDocument = await extractPDF(file);
    fileName.textContent = "✓ " + file.name + " آماده ارسال است";
  } catch (error) {
    alert(error.message);
    clearSelectedFile();
  }
});

removeFileBtn.addEventListener("click", () => {
  clearSelectedFile();
});

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    const prompt = button.dataset.prompt;
    input.value = prompt;
    sendMessage(prompt);
  });
});

document.getElementById("newChatBtn").addEventListener("click", () => {
  if (busy) return;

  messages = [];
  chat.innerHTML = "";
  clearSelectedFile();

  welcome.style.display = "block";
  input.value = "";
  input.focus();
});

</script>
</body>
</html>
