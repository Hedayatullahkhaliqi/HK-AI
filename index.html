
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d19">
<title>HK AI - Your Smart Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080d19;
  color: #f1f5ff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 72px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0d1424;
  border-bottom: 1px solid #202b40;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  background: linear-gradient(135deg, #2878ff, #963eff);
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 0 25px #5140ff44;
}

.brand-name {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .5px;
}

.brand-name span {
  color: #6b91ff;
}

.status {
  font-size: 12px;
  color: #65e6a3;
  background: #102a27;
  border: 1px solid #1d5143;
  padding: 7px 12px;
  border-radius: 30px;
}

main {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 35px 20px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.welcome {
  text-align: center;
  margin: auto auto 35px;
  max-width: 600px;
}

.welcome-icon {
  width: 76px;
  height: 76px;
  border-radius: 25px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  font-size: 34px;
  background: linear-gradient(135deg, #176bff, #873dff);
  box-shadow: 0 0 50px #6545ff44;
}

.welcome h1 {
  font-size: clamp(28px, 6vw, 40px);
  margin: 0 0 12px;
}

.welcome h1 span {
  background: linear-gradient(90deg, #5ba5ff, #b17aff);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: #94a3b8;
  line-height: 1.9;
  font-size: 15px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 28px;
}

.suggestion {
  text-align: right;
  padding: 16px;
  color: #dce6fa;
  background: #111c30;
  border: 1px solid #263650;
  border-radius: 15px;
  cursor: pointer;
  font-size: 13px;
  transition: .2s;
}

.suggestion:hover {
  border-color: #648bff;
  background: #182844;
}

.suggestion small {
  display: block;
  color: #8498b9;
  margin-top: 7px;
}

#chat {
  display: none;
  flex-direction: column;
  gap: 20px;
  padding: 15px 0 30px;
}

.message {
  display: flex;
  gap: 11px;
  align-items: flex-start;
}

.message.user {
  flex-direction: row-reverse;
}

.avatar {
  flex-shrink: 0;
  width: 35px;
  height: 35px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2779ff, #963eff);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: bold;
}

.user .avatar {
  background: #263750;
}

.bubble {
  max-width: 82%;
  padding: 13px 17px;
  border-radius: 16px;
  background: #121e32;
  border: 1px solid #263750;
  color: #e6edfa;
  line-height: 1.9;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: #263b70;
  border-color: #3d5c9b;
}

.typing {
  color: #93a8cc;
  font-size: 13px;
  padding: 10px;
}

.composer {
  position: sticky;
  bottom: 0;
  padding: 15px 0 18px;
  background: linear-gradient(transparent, #080d19 20%);
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px;
  border-radius: 19px;
  background: #111c30;
  border: 1px solid #30415e;
  box-shadow: 0 10px 35px #0005;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 140px;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font-family: inherit;
  font-size: 14px;
  padding: 10px;
  line-height: 1.7;
}

textarea::placeholder {
  color: #788ba8;
}

.send {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(135deg, #287aff, #8650ff);
  color: white;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

.send:disabled {
  opacity: .45;
  cursor: not-allowed;
}

footer {
  text-align: center;
  color: #62728c;
  font-size: 11px;
  padding: 0 10px 15px;
}

@media (max-width: 520px) {
  header {
    height: 64px;
    padding: 0 15px;
  }

  main {
    padding: 25px 14px 10px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .welcome {
    margin-bottom: 25px;
  }

  .bubble {
    max-width: 88%;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">HK</div>
    <div class="brand-name">HK <span>AI</span></div>
  </div>
  <div class="status">● Online</div>
</header>

<main>

<section class="welcome" id="welcome">
  <div class="welcome-icon">✦</div>
  <h1>سلام! من <span>HK AI</span> هستم</h1>
  <p>
    دستیار هوشمند شما برای پاسخ به پرسش‌ها،
    یادگیری، خلاقیت و حل مشکلات.
    هر چیزی می‌خواهید از من بپرسید.
  </p>

  <div class="suggestions">
    <button class="suggestion" onclick="useSuggestion('برایم یک برنامه یادگیری زبان انگلیسی بساز')">
      📚 یادگیری
      <small>یادگیری زبان و مهارت‌های جدید</small>
    </button>

    <button class="suggestion" onclick="useSuggestion('یک ایده خلاقانه برای کسب درآمد آنلاین بده')">
      💡 ایده‌های خلاقانه
      <small>ایده‌های جدید و کاربردی</small>
    </button>

    <button class="suggestion" onclick="useSuggestion('هوش مصنوعی را به زبان ساده برایم توضیح بده')">
      🤖 هوش مصنوعی
      <small>پرسش درباره تکنولوژی</small>
    </button>

    <button class="suggestion" onclick="useSuggestion('یک داستان کوتاه و جالب برایم بنویس')">
      ✍️ نویسندگی
      <small>داستان و محتوای خلاقانه</small>
    </button>
  </div>
</section>

<section id="chat"></section>

<div class="composer">
  <div class="input-box">
    <textarea id="messageInput" rows="1"
      placeholder="پیام خود را برای HK بنویسید..."></textarea>
    <button class="send" id="sendButton" onclick="sendMessage()">➤</button>
  </div>
</div>

</main>

<footer>
  HK AI can make mistakes. Please verify important information.
</footer>

</div>

<script>
const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const sendButton = document.getElementById("sendButton");

let messages = [];
let busy = false;

function useSuggestion(text) {
  input.value = text;
  sendMessage();
}

function addMessage(text, role) {
  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "HK";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);
  chat.appendChild(row);

  chat.scrollTop = chat.scrollHeight;
  return row;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || busy) return;

  busy = true;
  sendButton.disabled = true;

  welcome.style.display = "none";
  chat.style.display = "flex";

  addMessage(text, "user");
  messages.push({ role: "user", content: text });

  input.value = "";
  input.style.height = "auto";

  const loading = document.createElement("div");
  loading.className = "typing";
  loading.textContent = "HK در حال فکر کردن است...";
  chat.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ messages })
    });

    const data = await response.json();

    if (!response.ok || !data.reply) {
      throw new Error(data.error || "ارتباط با HK برقرار نشد.");
    }

    messages.push({
      role: "assistant",
      content: data.reply
    });

    addMessage(data.reply, "assistant");

  } catch (error) {
    messages.pop();
    addMessage("خطا: " + error.message, "assistant");

  } finally {
    loading.remove();
    busy = false;
    sendButton.disabled = false;
    input.focus();
  }
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
