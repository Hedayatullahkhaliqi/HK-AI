<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<meta name="description" content="HK AI - Hedayatullah Khaliqi AI">
<title>HK AI | Smart Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080d19;--panel:#101a2b;--panel2:#17263c;--border:rgba(160,190,235,.15);--text:#edf4ff;--muted:#91a3bd;--blue:#438cff;--cyan:#55d6ff;--gold:#f4c64e}
html,body{margin:0;width:100%;max-width:100%;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh;min-height:100svh}
button,textarea{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:1100px;min-height:100vh;min-height:100svh;margin:auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);position:relative}
.app:before{content:"";position:fixed;width:280px;height:280px;top:12%;left:-160px;border-radius:50%;background:rgba(34,105,220,.08);filter:blur(90px);pointer-events:none}
header{min-height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(8,13,25,.94);position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:49px;height:49px;border-radius:14px;object-fit:cover;border:1px solid rgba(131,190,255,.5);box-shadow:0 0 22px rgba(53,137,255,.2)}
.brand-name{font-size:19px;font-weight:900;letter-spacing:.5px}
.brand-sub{color:var(--muted);font-size:10px;margin-top:4px;letter-spacing:.5px}
.header-actions{display:flex;align-items:center;gap:9px}
.status{display:flex;align-items:center;gap:6px;color:#83dcb3;font-size:10px;margin-left:7px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#4cda98;box-shadow:0 0 9px #4cda98}
.new-chat{background:linear-gradient(145deg,#1c304b,#142238);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:12px;font-weight:600}
.new-chat:active{transform:scale(.97)}
main{flex:1;display:flex;flex-direction:column;width:100%;padding:20px 16px 14px}
.welcome{margin:auto;width:100%;max-width:660px;text-align:center;padding:32px 5px}
.welcome-logo{width:112px;height:112px;margin:0 auto 22px;border-radius:27px;object-fit:cover;box-shadow:0 0 42px rgba(48,125,255,.2)}
.welcome h1{font-size:28px;font-weight:900;margin:0 0 12px;background:linear-gradient(90deg,#f5f9ff,#83baff,#ffe29a);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);line-height:2;font-size:14px;margin:0 auto 27px;max-width:480px}
.welcome-tag{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;margin-bottom:19px;border:1px solid rgba(75,145,255,.22);border-radius:30px;color:#c5dfff;background:rgba(45,105,190,.1);font-size:11px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;text-align:right}
.suggestion{min-height:72px;display:flex;align-items:center;gap:11px;background:linear-gradient(145deg,#142238,#101a2a);border:1px solid var(--border);border-radius:15px;color:var(--text);padding:13px;font-size:12px;line-height:1.8;text-align:right}
.suggestion:active{transform:scale(.98);border-color:rgba(67,140,255,.5)}
.suggestion-icon{width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;border-radius:11px;background:rgba(65,135,255,.13);font-size:17px}
#chat{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:19px;padding:12px 0 25px}
.message{display:flex;flex-direction:column;max-width:91%;gap:7px;min-width:0}
.message.user{align-self:flex-start}
.message.assistant{align-self:flex-end}
.message-label{color:var(--muted);font-size:11px;padding:0 5px}
.message-content{overflow-wrap:anywhere;word-break:break-word;line-height:1.95;font-size:14px;padding:13px 16px;border-radius:17px;white-space:normal}
.user .message-content{background:linear-gradient(145deg,#1b3b65,#142d4d);border:1px solid rgba(85,150,255,.22);border-bottom-left-radius:5px}
.assistant .message-content{background:linear-gradient(145deg,#142136,#101a2a);border:1px solid var(--border);border-bottom-right-radius:5px}
.message-content p{margin:0 0 10px}
.message-content p:last-child{margin-bottom:0}
.message-content pre{direction:ltr;text-align:left;white-space:pre;overflow-x:auto;background:#080f1d;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px}
.message-content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:rgba(120,160,220,.12);padding:2px 5px;border-radius:5px}
.message-content pre code{background:none;padding:0}
.message-content a{color:#82c7ff;text-decoration:underline}
.message-content ul,.message-content ol{padding-right:23px;line-height:2}
.message-actions{display:flex;justify-content:flex-end;gap:8px}
.copy-btn{color:#9cb0cb;background:transparent;border:0;font-size:11px;padding:6px 8px}
.typing{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;padding:12px}
.typing-dots{display:flex;gap:4px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:#69aaff;animation:dot 1s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}
.composer-area{position:sticky;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%);z-index:10}
.composer{max-width:780px;margin:auto}
.file-preview{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:9px;font-size:12px;color:var(--muted)}
.file-preview.show{display:flex}
.remove-file{color:#ff8585;border:0;background:transparent;font-size:20px}
.input-box{direction:rtl;display:flex;align-items:flex-end;gap:8px;padding:9px;background:linear-gradient(145deg,#142238,#101a2b);border:1px solid rgba(125,160,210,.2);border-radius:19px;box-shadow:0 9px 35px rgba(0,0,0,.25)}
.input-box:focus-within{border-color:rgba(67,140,255,.7);box-shadow:0 0 0 3px rgba(67,140,255,.07),0 9px 35px rgba(0,0,0,.25)}
#messageInput{flex:1;min-width:0;min-height:44px;max-height:140px;resize:none;outline:none;border:0;background:transparent;color:var(--text);padding:11px 5px;font-size:16px;line-height:1.6;direction:auto;appearance:none;-webkit-appearance:none}
#messageInput::placeholder{color:#788ba7}
.attach-btn,.send-btn{flex:0 0 43px;width:43px;height:43px;border-radius:14px;border:0;display:grid;place-items:center}
.send-btn{background:linear-gradient(145deg,#55a1ff,#2563d9);color:white;font-size:20px;font-weight:bold;box-shadow:0 4px 14px rgba(37,99,235,.25)}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
.attach-btn{background:#1b2d46;color:#b9cce8;font-size:22px}
#fileInput{display:none}
.footer-note{text-align:center;color:#657690;font-size:10px;padding-top:10px}
.error-note{color:#ffaaaa}
.message-content blockquote{border-right:3px solid #579dff;margin:8px 0;padding:4px 12px;color:#c5d7ee}
@media(max-width:480px){
header{min-height:63px;padding:0 12px}
.logo{width:43px;height:43px}
.brand-name{font-size:17px}
.brand-sub{font-size:9px}
.status{font-size:9px}
.new-chat{padding:9px 10px;font-size:11px}
main{padding:12px}
.welcome h1{font-size:24px}
.welcome p{font-size:13px}
.welcome-logo{width:94px;height:94px}
.message{max-width:96%}
.composer-area{padding-left:9px;padding-right:9px}
.suggestions{gap:8px}
.suggestion{padding:10px;min-height:66px;font-size:11px}
}
@media(max-width:350px){
.suggestions{grid-template-columns:1fr}
.status{display:none}
}
</style>
</head>

<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $=id=>document.getElementById(id);
const chat=$("chat"),welcome=$("welcome"),input=$("messageInput"),sendBtn=$("sendBtn"),attachBtn=$("attachBtn"),fileInput=$("fileInput"),filePreview=$("filePreview"),fileName=$("fileName");
const STORAGE_KEY="hk_ai_chat_history_v2";
let messages=[],busy=false,selectedDocument="",selectedFile=null;

function saveHistory(){
try{localStorage.setItem(STORAGE_KEY,JSON.stringify(messages.slice(-40)))}catch(e){console.warn("History storage unavailable",e)}
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))
}

function safeURL(url){
try{const u=new URL(url);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}
}

function renderMarkdown(raw){
let s=escapeHTML(raw);
const blocks=[];
s=s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
const n=blocks.length;
blocks.push(`<pre><code>${code.trim()}</code></pre>`);
return `@@BLOCK${n}@@`
});
s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
s=s.replace(/^### (.+)$/gm,"<h4>$1</h4>").replace(/^## (.+)$/gm,"<h3>$1</h3>").replace(/^# (.+)$/gm,"<h3>$1</h3>");
s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>{
const safe=safeURL(url);
return safe?`<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>`:label
});
s=s.replace(/^\s*[-*] (.+)$/gm,"<li>$1</li>").replace(/(?:<li>[\s\S]*?<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
s=s.split(/\n{2,}/).map(part=>{
if(/^@@BLOCK\d+@@$/.test(part))return part;
if(part.startsWith("<h")||part.startsWith("<ul>"))return part;
return `<p>${part.replace(/\n/g,"<br>")}</p>`
}).join("");
s=s.replace(/@@BLOCK(\d+)@@/g,(_,n)=>blocks[Number(n)]);
return s
}

function addMessage(role,content,save=true){
const wrap=document.createElement("div");
wrap.className="message "+role;
const label=document.createElement("div");
label.className="message-label";
label.textContent=role==="user"?"شما":"HK AI";
const body=document.createElement("div");
body.className="message-content";
if(role==="assistant")body.innerHTML=renderMarkdown(content);
else body.textContent=content;
wrap.append(label,body);
if(role==="assistant"){
const actions=document.createElement("div");
actions.className="message-actions";
const copy=document.createElement("button");
copy.className="copy-btn";
copy.textContent="کاپی پاسخ";
copy.addEventListener("click",async()=>{
try{await navigator.clipboard.writeText(content);copy.textContent="کاپی شد ✓"}catch{copy.textContent="کاپی نشد"}
});
actions.append(copy);
wrap.append(actions)
}
chat.append(wrap);
if(save)saveHistory();
return wrap
}

function showTyping(){
const el=document.createElement("div");
el.className="typing";
el.id="typing";
el.innerHTML='HK AI در حال نوشتن پاسخ است <span class="typing-dots"><span></span><span></span><span></span></span>';
chat.append(el)
}

function removeTyping(){
const el=$("typing");
if(el)el.remove()
}

function setBusy(v){
busy=v;
sendBtn.disabled=v;
input.disabled=v;
attachBtn.disabled=v;
sendBtn.textContent=v?"…":"➤"
}

function clearSelectedFile(){
selectedDocument="";
selectedFile=null;
fileInput.value="";
filePreview.classList.remove("show");
fileName.textContent=""
}

async function extractPDF(file){
if(!window.pdfjsLib)throw new Error("ابزار خواندن PDF بارگذاری نشد؛ اینترنت را بررسی کنید.");
if(file.size>10*1024*1024)throw new Error("حجم فایل PDF نباید بیشتر از ۱۰ مگابایت باشد.");
const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
if(pdf.numPages>30)throw new Error("فایل PDF نباید بیشتر از ۳۰ صفحه باشد.");
let text="";
for(let n=1;n<=pdf.numPages;n++){
const page=await pdf.getPage(n),content=await page.getTextContent();
text+=content.items.map(x=>x.str).join(" ")+"\n";
if(text.length>30000){text=text.slice(0,30000);break}
}
if(!text.trim())throw new Error("متنی در این PDF پیدا نشد؛ شاید فایل اسکن‌شده باشد.");
return text
}

async function sendMessage(customText=null){
if(busy)return;
const text=(customText!==null?customText:input.value).trim();
if(!text&&!selectedFile)return;
let userText=text;
if(selectedFile&&selectedDocument)userText=(text?text+"\n\n":"لطفاً محتوای فایل PDF پیوست‌شده را بررسی کن: ")+"فایل PDF: "+selectedFile.name;
if(!userText)return;
welcome.style.display="none";
addMessage("user",userText,false);
messages.push({role:"user",content:userText});
saveHistory();
input.value="";
input.style.height="44px";
setBusy(true);
showTyping();
try{
const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),90000);
let response;
try{
response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({messages:messages.slice(-20),document:selectedDocument}),
signal:controller.signal
})
}finally{clearTimeout(timeout)}
let data;
try{data=await response.json()}catch{throw new Error("پاسخ سرور قابل خواندن نیست.")}
if(!response.ok)throw new Error(data.error||"خطا در ارتباط با سرور.");
if(typeof data.reply!=="string"||!data.reply.trim())throw new Error("پاسخ خالی از سرور دریافت شد.");
messages.push({role:"assistant",content:data.reply});
removeTyping();
addMessage("assistant",data.reply);
clearSelectedFile()
}catch(error){
messages.pop();
saveHistory();
removeTyping();
const msg=error.name==="AbortError"?"زمان پاسخ‌گویی سرور تمام شد؛ دوباره تلاش کنید.":(error.message||"ارتباط با سرور برقرار نشد.");
const node=addMessage("assistant","متأسفم، مشکلی پیش آمد:\n"+msg,false);
node.querySelector(".message-content").classList.add("error-note")
}finally{
removeTyping();
setBusy(false)
}
}

sendBtn.addEventListener("click",()=>sendMessage());
input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});
input.addEventListener("input",()=>{
input.style.height="44px";
input.style.height=Math.min(input.scrollHeight,140)+"px"
});
attachBtn.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",async()=>{
const file=fileInput.files[0];
if(!file)return;
if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){
alert("لطفاً فقط فایل PDF انتخاب کنید.");
clearSelectedFile();
return
}
selectedFile=file;
fileName.textContent="در حال خواندن: "+file.name;
filePreview.classList.add("show");
try{
selectedDocument=await extractPDF(file);
fileName.textContent="✓ "+file.name+" آماده ارسال است"
}catch(e){alert(e.message);clearSelectedFile()}
});

$("removeFile").addEventListener("click",clearSelectedFile);
document.querySelectorAll(".suggestion").forEach(b=>b.addEventListener("click",()=>sendMessage(b.dataset.prompt)));

$("newChatBtn").addEventListener("click",()=>{
if(busy)return;
messages=[];
chat.innerHTML="";
clearSelectedFile();
try{localStorage.removeItem(STORAGE_KEY)}catch(e){console.warn(e)}
welcome.style.display="block";
input.value="";
input.style.height="44px"
});

function restoreHistory(){
try{
const raw=localStorage.getItem(STORAGE_KEY);
if(!raw)return;
const list=JSON.parse(raw);
if(!Array.isArray(list))return;
messages=list.slice(-40).filter(m=>m&&(m.role==="user"||m.role==="assistant")&&typeof m.content==="string");
if(messages.length){
welcome.style.display="none";
messages.forEach(m=>addMessage(m.role,m.content,false))
}
}catch(e){console.warn("Could not restore history",e)}
}
restoreHistory();
</script>
</body>
</html>
