
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK AI</title>

<style>
body {
  margin: 0;
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #111c2e;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #26364e;
}
.logo {
  color: #4b91ff;
  font-size: 35px;
  font-weight: bold;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}
#welcome {
  text-align: center;
  margin-top: 90px;
}
#chat {
  min-height: 300px;
}
.message {
  padding: 13px;
  margin: 12px 0;
  border-radius: 12px;
  background: #172943;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.user {
  background: #24569a;
  text-align: right;
}
.composer {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
textarea {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 12px;
  background: #172943;
  color: white;
  border: 1px solid #40516b;
  font-size: 16px;
}
button {
  background: #3985e8;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
}
button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <div class="logo">HK</div>
  <div>YOUR AI ASSISTANT</div>
</header>

<main>

  <div id="welcome">
    <h2>Hello, I'm HK.</h2>
    <p>Your multilingual AI assistant.</p>
    <p>Welcome to HK AI!</p>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <textarea id="input"
      rows="2"
      placeholder="Message HK..."></textarea>

    <button id="send" onclick="sendMessage()">
      Send
    </button>
  </div>

</main>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const send = document.getElementById("send");

let messages = [];
let busy = false;

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || busy) return;

  busy = true;
  send.disabled = true;
  send.textContent = "Wait...";

  welcome.style.display = "none";

  addMessage(text, "user");

  messages.push({
    role: "user",
    content: text
  });

  input.value = "";

  const loading = addMessage("HK is thinking...", "");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error");
    }

    if (!data.reply) {
      throw new Error("Empty response from AI");
    }

    loading.textContent = data.reply;

    messages.push({
      role: "assistant",
      content: data.reply
    });

  } catch (error) {
    loading.textContent =
      "Sorry! HK could not connect. Please try again.";

    console.error(error);

    messages.pop();
  }

  busy = false;
  send.disabled = false;
  send.textContent = "Send";
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
