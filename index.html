
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<meta name="description" content="HK AI - Hedayatullah Khaliqi AI">
<title>HK AI | Smart Assistant</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#080d19;
  --panel:#101a2b;
  --panel2:#17263c;
  --border:rgba(160,190,235,.13);
  --text:#edf4ff;
  --muted:#91a3bd;
  --blue:#438cff;
  --cyan:#55d6ff;
  --gold:#d9e7ff;
}

html,body{
  margin:0;
  width:100%;
  max-width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}

body{min-height:100vh;min-height:100svh}
button,textarea{font:inherit}
button{cursor:pointer}

.app{
  width:100%;
  max-width:1100px;
  min-height:100vh;
  min-height:100svh;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  position:relative;
}

.app:before{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  top:12%;
  left:-160px;
  border-radius:50%;
  background:rgba(34,105,220,.08);
  filter:blur(90px);
  pointer-events:none;
}

header{
  min-height:72px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(8,13,25,.94);
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.brand{display:flex;align-items:center;gap:12px}

.logo{
  width:47px;
  height:47px;
  border-radius:15px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#294d7c,#111d32 65%,#0b1424);
  border:1px solid rgba(131,190,255,.45);
  box-shadow:0 0 22px rgba(53,137,255,.2),inset 0 1px 8px rgba(255,255,255,.12);
}

.logo:before{
  content:"";
  position:absolute;
  inset:-50%;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.2),transparent 60%);
  transform:rotate(25deg);
}

.logo svg{width:38px;height:38px;position:relative;z-index:1}

.brand-name{
  font-size:19px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
  letter-spacing:.5px;
}

.header-actions{display:flex;align-items:center;gap:9px}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  color:#83dcb3;
  font-size:10px;
  margin-left:7px;
}

.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:#4cda98;
  box-shadow:0 0 9px #4cda98;
}

.new-chat{
  background:linear-gradient(145deg,#1c304b,#142238);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 13px;
  font-size:12px;
  font-weight:600;
}

.new-chat:active{transform:scale(.97)}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  width:100%;
  padding:20px 16px 14px;
}

.welcome{
  margin:auto;
  width:100%;
  max-width:660px;
  text-align:center;
  padding:32px 5px;
}

.welcome-logo{
  width:94px;height:94px;
  margin:0 auto 23px;
  border-radius:29px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#254d80,#14233b 65%,#0c1627);
  border:1px solid rgba(123,183,255,.45);
  box-shadow:0 0 55px rgba(48,125,255,.2),inset 0 1px 12px rgba(255,255,255,.12);
  position:relative;
  overflow:hidden;
}

.welcome-logo:after{
  content:"";
  position:absolute;
  width:140%;
  height:30%;
  background:rgba(255,255,255,.07);
  transform:rotate(-35deg);
}

.welcome-logo svg{width:70px;height:70px;position:relative;z-index:1}

.welcome h1{
  font-size:28px;
  font-weight:900;
  margin:0 0 12px;
  background:linear-gradient(90deg,#f5f9ff,#83baff,#e7f5ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome p{
  color:var(--muted);
  line-height:2;
  font-size:14px;
  margin:0 auto 27px;
  max-width:480px;
}

.welcome-tag{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 13px;
  margin-bottom:19px;
  border:1px solid rgba(75,145,255,.22);
  border-radius:30px;
  color:#9fcaff;
  background:rgba(45,105,190,.1);
  font-size:11px;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
  text-align:right;
}

.suggestion{
  min-height:72px;
  display:flex;
  align-items:center;
  gap:11px;
  background:linear-gradient(145deg,#142238,#101a2a);
  border:1px solid var(--border);
  border-radius:15px;
  color:var(--text);
  padding:13px;
  font-size:12px;
  line-height:1.8;
  text-align:right;
  transition:.2s;
}

.suggestion:active{
  transform:scale(.98);
  border-color:rgba(67,140,255,.5);
}

.suggestion-icon{
  width:35px;height:35px;
  flex:0 0 35px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:rgba(65,135,255,.13);
  font-size:17px;
}

#chat{
  width:100%;
  max-width:780px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:19px;
  padding:12px 0 25px;
}

.message{
  display:flex;
  flex-direction:column;
  max-width:91%;
  gap:7px;
  min-width:0;
}

.message.user{align-self:flex-start}
.message.assistant{align-self:flex-end}

.message-label{
  color:var(--muted);
  font-size:11px;
  padding:0 5px;
}

.message-content{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  line-height:1.95;
  font-size:14px;
  padding:13px 16px;
  border-radius:17px;
}

.user .message-content{
  background:linear-gradient(145deg,#1b3b65,#142d4d);
  border:1px solid rgba(85,150,255,.22);
  border-bottom-left-radius:5px;
}

.assistant .message-content{
  background:linear-gradient(145deg,#142136,#101a2a);
  border:1px solid var(--border);
  border-bottom-right-radius:5px;
}

.message-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.copy-btn{
  color:#9cb0cb;
  background:transparent;
  border:0;
  font-size:11px;
  padding:6px 8px;
}

.copy-btn:active{color:#fff}

.typing{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:12px;
  padding:12px;
}

.typing-dots{display:flex;gap:4px}
.typing-dots span{
  width:5px;height:5px;border-radius:50%;
  background:#69aaff;
  animation:dot 1s infinite ease-in-out;
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}

@keyframes dot{
  0%,80%,100%{transform:translateY(0);opacity:.45}
  40%{transform:translateY(-5px);opacity:1}
}

.composer-area{
  position:sticky;
  bottom:0;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 20%);
  z-index:10;
}

.composer{max-width:780px;margin:auto}

.file-preview{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:9px;
  font-size:12px;
  color:var(--muted);
}

.file-preview.show{display:flex}

.remove-file{
  color:#ff8585;
  border:0;
  background:transparent;
  font-size:20px;
}

.input-box{
  direction:rtl;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:9px;
  background:linear-gradient(145deg,#142238,#101a2b);
  border:1px solid rgba(125,160,210,.2);
  border-radius:19px;
  box-shadow:0 9px 35px rgba(0,0,0,.25);
  transition:border-color .2s;
}

.input-box:focus-within{
  border-color:rgba(67,140,255,.7);
  box-shadow:0 0 0 3px rgba(67,140,255,.07),0 9px 35px rgba(0,0,0,.25);
}

#messageInput{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:140px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:var(--text);
  padding:11px 5px;
  font-size:16px;
  line-height:1.6;
  direction:auto;
  appearance:none;
  -webkit-appearance:none;
}

#messageInput::placeholder{color:#788ba7}

.attach-btn,.send-btn{
  flex:0 0 43px;
  width:43px;height:43px;
  border-radius:14px;
  border:0;
  display:grid;
  place-items:center;
}

.send-btn{
  background:linear-gradient(145deg,#55a1ff,#2563d9);
  color:white;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 4px 14px rgba(37,99,235,.25);
}

.send-btn:disabled{opacity:.45;cursor:not-allowed}

.attach-btn{
  background:#1b2d46;
  color:#b9cce8;
  font-size:22px;
}

#fileInput{display:none}

.footer-note{
  text-align:center;
  color:#657690;
  font-size:10px;
  padding-top:10px;
}

.empty-history{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding:15px;
}

@media(max-width:480px){
  header{min-height:63px;padding:0 12px}
  .logo{width:42px;height:42px}
  .brand-name{font-size:17px}
  .brand-sub{font-size:9px}
  .status{font-size:9px}
  .new-chat{padding:9px 10px;font-size:11px}
  main{padding:12px 12px}
  .welcome h1{font-size:24px}
  .welcome p{font-size:13px}
  .welcome-logo{width:83px;height:83px}
  .welcome-logo svg{width:62px;height:62px}
  .message{max-width:96%}
  .composer-area{padding-left:9px;padding-right:9px}
  .suggestions{gap:8px}
  .suggestion{padding:10px;min-height:66px;font-size:11px}
}

@media(max-width:350px){
  .suggestions{grid-template-columns:1fr}
  .status{display:none}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none" aria-label="HK logo">
        <path d="M15 18V82M15 50L47 18M15 50L48 82"
          stroke="#E7F2FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M57 18V82M57 50H84M84 18V82"
          stroke="#65B8FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 91H90" stroke="#8DDFFF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">HK AI</div>
      <div class="brand-sub">Hedayatullah Khaliqi</div>
    </div>
  </div>

  <div class="header-actions">
    <div class="status"><span class="status-dot"></span> دستیار هوشمند</div>
    <button class="new-chat" id="newChatBtn">＋ گفتگوی جدید</button>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="welcome-logo">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M15 18V82M15 50L47 18M15 50L48 82"
          stroke="#E7F2FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M57 18V82M57 50H84M84 18V82"
          stroke="#65B8FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 91H90" stroke="#8DDFFF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      </svg>
    </div>

    <div class="welcome-tag">✦ هوش مصنوعی برای دانش و انسان</div>
    <h1>به HK AI خوش آمدید</h1>
    <p>
      همراه هوشمند شما برای یادگیری، نوشتن، ترجمه،
      برنامه‌نویسی، تحلیل و پاسخ به پرسش‌ها.
    </p>

    <div class="suggestions">
      <button class="suggestion" data-prompt="هوش مصنوعی چیست؟ به زبان ساده توضیح بده.">
        <span class="suggestion-icon">✨</span>
        <span>هوش مصنوعی چیست؟</span>
      </button>

      <button class="suggestion" data-prompt="یک برنامه برای یادگیری زبان انگلیسی برایم بساز.">
        <span class="suggestion-icon">📚</span>
        <span>یادگیری زبان انگلیسی</span>
      </button>

      <button class="suggestion" data-prompt="یک کد ساده HTML برای ساخت وب‌سایت بنویس.">
        <span class="suggestion-icon">💻</span>
        <span>کمک در برنامه‌نویسی</span>
      </button>

      <button class="suggestion" data-prompt="امکانات و کاربردهای مهم هوش مصنوعی را توضیح بده.">
        <span class="suggestion-icon">🧠</span>
        <span>پرسش عمومی</span>
      </button>
    </div>
  </section>

  <section id="chat"></section>
</main>

<div class="composer-area">
  <div class="composer">

    <div class="file-preview" id="filePreview">
      <span id="fileName">فایل انتخاب شد</span>
      <button class="remove-file" id="removeFile" title="حذف فایل">×</button>
    </div>

    <div class="input-box">
      <button class="send-btn" id="sendBtn" title="ارسال پیام">➤</button>

      <textarea id="messageInput" rows="1"
        placeholder="پیام خود را بنویسید..."></textarea>

      <button class="attach-btn" id="attachBtn" title="افزودن PDF">＋</button>

      <input type="file" id="fileInput" accept=".pdf,application/pdf">
    </div>

    <div class="footer-note">
      HK AI ممکن است گاهی اشتباه کند؛ پاسخ‌های مهم را بررسی کنید.
    </div>

  </div>
</div>

</div>

<script>
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const input=document.getElementById("messageInput");
const sendBtn=document.getElementById("sendBtn");
const attachBtn=document.getElementById("attachBtn");
const fileInput=document.getElementById("fileInput");
const filePreview=document.getElementById("filePreview");
const fileName=document.getElementById("fileName");
const removeFileBtn=document.getElementById("removeFile");

const STORAGE_KEY="hk_ai_chat_history_v2";

let messages=[];
let busy=false;
let selectedDocument="";
let selectedFile=null;

function saveHistory(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(messages.slice(-40)));
  }catch(error){
    console.warn("History storage unavailable",error);
  }
}

function addMessage(role,content,save=true){
  const wrapper=document.createElement("div");
  wrapper.className="message "+role;

  const label=document.createElement("div");
  label.className="message-label";
  label.textContent=role==="user"?"شما":"HK AI";

  const text=document.createElement("div");
  text.className="message-content";
  text.textContent=content;

  wrapper.appendChild(label);
  wrapper.appendChild(text);

  if(role==="assistant"){
    const actions=document.createElement("div");
    actions.className="message-actions";

    const copy=document.createElement("button");
    copy.className="copy-btn";
    copy.textContent="کاپی پاسخ";

    copy.addEventListener("click",async()=>{
      try{
        await navigator.clipboard.writeText(content);
        copy.textContent="کاپی شد ✓";
      }catch{
        copy.textContent="کاپی نشد";
      }
    });

    actions.appendChild(copy);
    wrapper.appendChild(actions);
  }

  chat.appendChild(wrapper);

  if(save) saveHistory();
}

function showTyping(){
  const element=document.createElement("div");
  element.className="typing";
  element.id="typing";
  element.innerHTML=
    'HK AI در حال نوشتن پاسخ است <span class="typing-dots"><span></span><span></span><span></span></span>';
  chat.appendChild(element);
}

function removeTyping(){
  const element=document.getElementById("typing");
  if(element)element.remove();
}

function setBusy(value){
  busy=value;
  sendBtn.disabled=value;
  input.disabled=value;
  attachBtn.disabled=value;
  sendBtn.textContent=value?"…":"➤";
}

function clearSelectedFile(){
  selectedDocument="";
  selectedFile=null;
  fileInput.value="";
  filePreview.classList.remove("show");
  fileName.textContent="";
}

async function extractPDF(file){
  if(!window.pdfjsLib){
    throw new Error("ابزار خواندن PDF بارگذاری نشد. اینترنت را بررسی کنید.");
  }

  if(file.size>10*1024*1024){
    throw new Error("حجم فایل PDF نباید بیشتر از ۱۰ مگابایت باشد.");
  }

  const buffer=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({
    data:new Uint8Array(buffer)
  }).promise;

  if(pdf.numPages>30){
    throw new Error("فایل PDF نباید بیشتر از ۳۰ صفحه باشد.");
  }

  let fullText="";

  for(let pageNumber=1;pageNumber<=pdf.numPages;pageNumber++){
    const page=await pdf.getPage(pageNumber);
    const content=await page.getTextContent();

    fullText+=content.items.map(item=>item.str).join(" ")+"\n";

    if(fullText.length>30000){
      fullText=fullText.slice(0,30000);
      break;
    }
  }

  if(!fullText.trim()){
    throw new Error("متنی در این PDF پیدا نشد. شاید فایل اسکن‌شده باشد.");
  }

  return fullText;
}

async function sendMessage(customText=null){
  if(busy)return;

  const text=(customText!==null?customText:input.value).trim();

  if(!text&&!selectedFile)return;

  let userMessage=text;

  if(selectedFile&&selectedDocument){
    userMessage=text
      ?text+"\n\nفایل PDF: "+selectedFile.name
      :"لطفاً محتوای فایل PDF پیوست‌شده را بررسی کن: "+selectedFile.name;
  }

  if(!userMessage)return;

  welcome.style.display="none";

  addMessage("user",userMessage,false);

  messages.push({
    role:"user",
    content:userMessage
  });

  saveHistory();

  input.value="";
  input.style.height="44px";

  setBusy(true);
  showTyping();

  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages:messages.slice(-20),
        document:selectedDocument
      })
    });

    let data;

    try{
      data=await response.json();
    }catch{
      throw new Error("پاسخ سرور قابل خواندن نیست.");
    }

    if(!response.ok){
      throw new Error(data.error||"خطا در ارتباط با سرور.");
    }

    if(!data.reply){
      throw new Error("پاسخ خالی از سرور دریافت شد.");
    }

    messages.push({
      role:"assistant",
      content:data.reply
    });

    removeTyping();
    addMessage("assistant",data.reply);
    clearSelectedFile();

  }catch(error){
    const errorText=error.message||
      "ارتباط با سرور برقرار نشد. دوباره تلاش کنید.";

    messages.pop();
    saveHistory();

    removeTyping();
    addMessage("assistant","متأسفم، مشکلی پیش آمد:\n"+errorText,false);

  }finally{
    removeTyping();
    setBusy(false);
    // فوکوس خودکار حذف شده تا صفحه آیفون بزرگ نشود.
  }
}

sendBtn.addEventListener("click",()=>sendMessage());

input.addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input",()=>{
  input.style.height="44px";
  input.style.height=Math.min(input.scrollHeight,140)+"px";
});

attachBtn.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",async()=>{
  const file=fileInput.files[0];
  if(!file)return;

  if(file.type!=="application/pdf"&&
     !file.name.toLowerCase().endsWith(".pdf")){
    alert("لطفاً فقط فایل PDF انتخاب کنید.");
    clearSelectedFile();
    return;
  }

  selectedFile=file;
  fileName.textContent="در حال خواندن: "+file.name;
  filePreview.classList.add("show");

  try{
    selectedDocument=await extractPDF(file);
    fileName.textContent="✓ "+file.name+" آماده ارسال است";
  }catch(error){
    alert(error.message);
    clearSelectedFile();
  }
});

removeFileBtn.addEventListener("click",clearSelectedFile);

document.querySelectorAll(".suggestion").forEach(button=>{
  button.addEventListener("click",()=>{
    sendMessage(button.dataset.prompt);
  });
});

document.getElementById("newChatBtn").addEventListener("click",()=>{
  if(busy)return;

  messages=[];
  chat.innerHTML="";
  clearSelectedFile();

  try{
    localStorage.removeItem(STORAGE_KEY);
  }catch(error){
    console.warn(error);
  }

  welcome.style.display="block";
  input.value="";
  input.style.height="44px";
});

function restoreHistory(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(!saved)return;

    const history=JSON.parse(saved);
    if(!Array.isArray(history))return;

    messages=history.slice(-40);

    if(messages.length){
      welcome.style.display="none";
      messages.forEach(item=>{
        if(item&&
           (item.role==="user"||item.role==="assistant")&&
           typeof item.content==="string"){
          addMessage(item.role,item.content,false);
        }
      });
    }
  }catch(error){
    console.warn("Could not restore chat history",error);
  }
}

restoreHistory();
</script>
</body>
