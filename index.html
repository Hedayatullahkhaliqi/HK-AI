
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<title>HK AI - Smart Assistant</title>

<style>
* { box-sizing: border-box; }

html {
  min-height: 100%;
  background: #080d19;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: #080d19;
  color: #f1f5ff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  min-height: 72px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0d1424;
  border-bottom: 1px solid #202b40;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  position: relative;
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 15px;
  background: radial-gradient(circle at 35% 25%, #263b61, #0a1222 75%);
  border: 1px solid #688dff88;
  display: grid;
  place-items: center;
  overflow: hidden;
  box-shadow: 0 0 18px #386dff55, inset 0 0 12px #ffffff12;
}

.logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.brand-name {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .5px;
}

.brand-name span { color: #6b91ff; }

.status {
  font-size: 12px;
  color: #65e6a3;
  background: #102a27;
  border: 1px solid #1d5143;
  padding: 7px 12px;
  border-radius: 30px;
}

main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 30px 20px 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.welcome {
  text-align: center;
  margin: auto auto 35px;
  max-width: 600px;
  padding-top: 25px;
}

.welcome-icon {
  width: 86px;
  height: 86px;
  border-radius: 25px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 35% 25%, #263b61, #0a1222 75%);
  border: 1px solid #688dff88;
  box-shadow: 0 0 35px #386dff55, inset 0 0 15px #ffffff12;
  overflow: hidden;
}

.welcome-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.welcome h1 {
  font-size: clamp(28px, 6vw, 40px);
  margin: 0 0 12px;
}

.welcome h1 span {
  background: linear-gradient(90deg, #5ba5ff, #b17aff);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: #94a3b8;
  line-height: 1.9;
  font-size: 15px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 28px;
}

.suggestion {
  text-align: right;
  padding: 16px;
  color: #dce6fa;
  background: #111c30;
  border: 1px solid #263650;
  border-radius: 15px;
  cursor: pointer;
  font-size: 13px;
}

.suggestion:active { background: #182844; }

.suggestion small {
  display: block;
  color: #8498b9;
  margin-top: 7px;
}

#chat {
  display: none;
  flex-direction: column;
  gap: 20px;
  padding: 15px 0 25px;
  min-width: 0;
}

.message {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  min-width: 0;
}

.message.user { flex-direction: row-reverse; }

.avatar {
  flex-shrink: 0;
  width: 35px;
  height: 35px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2779ff, #963eff);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: bold;
}

.user .avatar { background: #263750; }

.bubble {
  max-width: 82%;
  min-width: 0;
  padding: 13px 17px;
  border-radius: 16px;
  background: #121e32;
  border: 1px solid #263750;
  color: #e6edfa;
  line-height: 1.9;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: #263b70;
  border-color: #3d5c9b;
}

.typing {
  color: #93a8cc;
  font-size: 13px;
  padding: 10px;
}

.composer {
  position: sticky;
  bottom: 0;
  z-index: 10;
  width: 100%;
  margin-top: auto;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, #080d19 20%);
}

.input-box {
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px;
  border-radius: 19px;
  background: #111c30;
  border: 1px solid #30415e;
  box-shadow: 0 10px 35px #0005;
}

textarea {
  display: block;
  flex: 1;
  width: 0;
  min-width: 0;
  max-height: 120px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font-family: inherit;
  font-size: 16px;
  padding: 10px;
  line-height: 1.6;
  overflow-y: auto;
}

textarea::placeholder { color: #788ba8; }

.attach {
  width: 43px;
  min-width: 43px;
  height: 43px;
  flex-shrink: 0;
  border: 1px solid #30415e;
  border-radius: 13px;
  background: #1a2942;
  color: #b9cefa;
  font-size: 21px;
  cursor: pointer;
  display: grid;
  place-items: center;
}

.attach:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.send {
  width: 44px;
  min-width: 44px;
  height: 44px;
  flex-shrink: 0;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(135deg, #287aff, #8650ff);
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: grid;
  place-items: center;
}

.send:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.file-status {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
  padding: 10px 13px;
  background: #14233b;
  border: 1px solid #36527d;
  border-radius: 12px;
  color: #c9dcff;
  font-size: 12px;
}

.file-status.show { display: flex; }

.file-info {
  min-width: 0;
  overflow-wrap: anywhere;
}

.remove-file {
  flex-shrink: 0;
  border: 0;
  background: transparent;
  color: #ff8e9b;
  font-size: 18px;
  cursor: pointer;
  padding: 3px 7px;
}

footer {
  text-align: center;
  color: #62728c;
  font-size: 11px;
  padding: 0 10px 12px;
}

@media (max-width: 520px) {
  header {
    min-height: 64px;
    padding: 0 14px;
  }

  .logo {
    width: 44px;
    height: 44px;
  }

  main { padding: 20px 12px 0; }

  .suggestions { grid-template-columns: 1fr; }

  .welcome { margin-bottom: 25px; }

  .bubble { max-width: 88%; }

  .composer { padding-top: 10px; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#a9caff"/>
            <stop offset="70%" stop-color="#e5eaff"/>
            <stop offset="100%" stop-color="#789cff"/>
          </linearGradient>
          <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#35c5ff"/>
            <stop offset="50%" stop-color="#477dff"/>
            <stop offset="100%" stop-color="#bd62ff"/>
          </linearGradient>
        </defs>
        <ellipse cx="50" cy="51" rx="42" ry="19"
          fill="none" stroke="url(#orbit)" stroke-width="3"
          transform="rotate(-35 50 50)"/>
        <text x="50" y="64" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="39"
          font-weight="900" letter-spacing="-4"
          fill="url(#metal)">HK</text>
        <path d="M76 15 L79 23 L87 26 L79 29 L76 37 L73 29 L65 26 L73 23 Z"
          fill="#d9e8ff"/>
        <circle cx="16" cy="68" r="3" fill="#48c8ff"/>
      </svg>
    </div>
    <div class="brand-name">HK <span>AI</span></div>
  </div>
  <div class="status">● Online</div>
</header>

<main>

<section class="welcome" id="welcome">
  <div class="welcome-icon">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="welcomeMetal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="35%" stop-color="#a9caff"/>
          <stop offset="70%" stop-color="#e5eaff"/>
          <stop offset="100%" stop-color="#789cff"/>
        </linearGradient>
        <linearGradient id="welcomeOrbit" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#35c5ff"/>
          <stop offset="50%" stop-color="#477dff"/>
          <stop offset="100%" stop-color="#bd62ff"/>
        </linearGradient>
      </defs>
      <ellipse cx="50" cy="51" rx="42" ry="19"
        fill="none" stroke="url(#welcomeOrbit)" stroke-width="3"
        transform="rotate(-35 50 50)"/>
      <text x="50" y="64" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="39"
        font-weight="900" letter-spacing="-4"
        fill="url(#welcomeMetal)">HK</text>
      <path d="M76 15 L79 23 L87 26 L79 29 L76 37 L73 29 L65 26 L73 23 Z"
        fill="#d9e8ff"/>
      <circle cx="16" cy="68" r="3" fill="#48c8ff"/>
    </svg>
  </div>

  <h1>سلام! من <span>HK AI</span> هستم</h1>
  <p>
    دستیار هوشمند شما برای پاسخ به پرسش‌ها،
    یادگیری، خلاقیت و حل مشکلات.
    هر چیزی می‌خواهید از من بپرسید.
  </p>

  <div class="suggestions">
    <button class="suggestion" onclick="useSuggestion('برایم یک برنامه یادگیری زبان انگلیسی بساز')">
      📚 یادگیری
      <small>یادگیری زبان و مهارت‌های جدید</small>
    </button>

    <button class="suggestion" onclick="useSuggestion('یک ایده خلاقانه برای کسب درآمد آنلاین بده')">
      💡 ایده‌های خلاقانه
      <small>ایده‌های جدید و کاربردی</small>
    </button>

    <button class="suggestion" onclick="useSuggestion('هوش مصنوعی را به زبان ساده برایم توضیح بده')">
      🤖 هوش مصنوعی
      <small>پرسش درباره تکنولوژی</small>
    </button>

    <button class="suggestion" onclick="useSuggestion('یک داستان کوتاه و جالب برایم بنویس')">
      ✍️ نویسندگی
      <small>داستان و محتوای خلاقانه</small>
    </button>
  </div>
</section>

<section id="chat"></section>

<div class="composer">

  <div class="file-status" id="fileStatus">
    <div class="file-info" id="fileInfo"></div>
    <button class="remove-file" id="removeFile" type="button" aria-label="حذف فایل">✕</button>
  </div>

  <div class="input-box">

    <input
      type="file"
      id="pdfInput"
      accept=".pdf,application/pdf"
      hidden
    >

    <button
      class="attach"
      id="attachButton"
      type="button"
      onclick="document.getElementById('pdfInput').click()"
      title="انتخاب فایل PDF"
      aria-label="انتخاب فایل PDF"
    >📎</button>

    <textarea id="messageInput" rows="1"
      placeholder="پیام خود را برای HK بنویسید..."></textarea>

    <button class="send" id="sendButton" onclick="sendMessage()">➤</button>
  </div>
</div>

</main>

<footer>
  HK AI can make mistakes. Please verify important information.
</footer>

</div>

<!-- PDF text extraction library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const sendButton = document.getElementById("sendButton");
const pdfInput = document.getElementById("pdfInput");
const attachButton = document.getElementById("attachButton");
const fileStatus = document.getElementById("fileStatus");
const fileInfo = document.getElementById("fileInfo");
const removeFileButton = document.getElementById("removeFile");

let messages = [];
let busy = false;
let documentContext = null;
let readingPDF = false;

const MAX_PDF_SIZE = 10 * 1024 * 1024;
const MAX_PDF_PAGES = 30;
const MAX_PDF_TEXT = 35000;

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function useSuggestion(text) {
  input.value = text;
  sendMessage();
}

function addMessage(text, role) {
  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "HK";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);
  chat.appendChild(row);

  row.scrollIntoView({ behavior: "smooth", block: "end" });
  return row;
}

function showFileStatus(message) {
  fileInfo.textContent = message;
  fileStatus.classList.add("show");
}

function clearPDF() {
  documentContext = null;
  pdfInput.value = "";
  fileStatus.classList.remove("show");
  fileInfo.textContent = "";
}

removeFileButton.addEventListener("click", () => {
  if (busy || readingPDF) return;
  clearPDF();
});

async function handlePDF(file) {
  if (!file) return;

  if (busy || readingPDF) {
    pdfInput.value = "";
    return;
  }

  if (!file.name.toLowerCase().endsWith(".pdf") &&
      file.type !== "application/pdf") {
    alert("لطفاً فقط فایل PDF انتخاب کنید.");
    pdfInput.value = "";
    return;
  }

  if (file.size > MAX_PDF_SIZE) {
    alert("حجم فایل بیشتر از ۱۰ مگابایت است.");
    pdfInput.value = "";
    return;
  }

  if (!window.pdfjsLib) {
    alert("کتابخانه خواندن PDF بارگذاری نشده است. صفحه را دوباره باز کنید.");
    pdfInput.value = "";
    return;
  }

  readingPDF = true;
  attachButton.disabled = true;
  showFileStatus("⏳ در حال خواندن فایل PDF...");

  try {
    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: new Uint8Array(buffer)
    }).promise;

    if (pdf.numPages > MAX_PDF_PAGES) {
      throw new Error("این نسخه فعلاً فقط فایل‌های تا ۳۰ صفحه را می‌خواند.");
    }

    let extractedText = "";

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
      const page = await pdf.getPage(pageNumber);
      const content = await page.getTextContent();

      const pageText = content.items
        .map(item => item.str || "")
        .join(" ");

      extractedText += `\n\n--- صفحه ${pageNumber} ---\n${pageText}`;

      if (extractedText.length >= MAX_PDF_TEXT) {
        extractedText = extractedText.slice(0, MAX_PDF_TEXT);
        break;
      }
    }

    extractedText = extractedText.trim();

    if (!extractedText) {
      throw new Error(
        "از این PDF متن قابل خواندن پیدا نشد. شاید فایل اسکن‌شده یا تصویری باشد."
      );
    }

    documentContext = {
      name: file.name,
      pages: pdf.numPages,
      text: extractedText
    };

    showFileStatus(
      `📄 ${file.name} — آماده ارسال و تحلیل`
    );

  } catch (error) {
    clearPDF();
    alert("خواندن PDF موفق نشد: " + error.message);

  } finally {
    readingPDF = false;
    attachButton.disabled = false;
    pdfInput.value = "";
  }
}

pdfInput.addEventListener("change", () => {
  const file = pdfInput.files[0];
  handlePDF(file);
});

async function sendMessage() {
  const typedText = input.value.trim();

  if (busy || readingPDF) return;

  if (!typedText && !documentContext) return;

  const text = typedText ||
    "لطفاً این فایل PDF را خلاصه کن و نکات مهم آن را توضیح بده.";

  const selectedDocument = documentContext
    ? { ...documentContext }
    : null;

  busy = true;
  sendButton.disabled = true;
  attachButton.disabled = true;

  welcome.style.display = "none";
  chat.style.display = "flex";

  const userDisplayText = selectedDocument
    ? `${text}\n\n📎 فایل: ${selectedDocument.name}`
    : text;

  addMessage(userDisplayText, "user");
  messages.push({ role: "user", content: text });

  input.value = "";
  input.style.height = "auto";

  const loading = document.createElement("div");
  loading.className = "typing";
  loading.textContent = selectedDocument
    ? "HK در حال خواندن و بررسی فایل است..."
    : "HK در حال فکر کردن است...";

  chat.appendChild(loading);

  try {
    const requestBody = {
      messages
    };

    if (selectedDocument) {
      requestBody.document = selectedDocument;
    }

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(requestBody)
    });

    const data = await response.json();

    if (!response.ok || !data.reply) {
      throw new Error(data.error || "ارتباط با HK برقرار نشد.");
    }

    messages.push({
      role: "assistant",
      content: data.reply
    });

    addMessage(data.reply, "assistant");

    if (
      selectedDocument &&
      documentContext &&
      documentContext.name === selectedDocument.name
    ) {
      clearPDF();
    }

  } catch (error) {
    messages.pop();
    addMessage("خطا: " + error.message, "assistant");

  } finally {
    loading.remove();
    busy = false;
    sendButton.disabled = false;
    attachButton.disabled = false;
  }
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
